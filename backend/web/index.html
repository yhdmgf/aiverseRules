<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>插件商店 · 审核后台</title>
  <link rel="stylesheet" href="/admin/style.css">
</head>
<body>
  <!-- 登录视图 -->
  <div id="login-view" class="view">
    <form id="login-form" class="card login-card">
      <h1>插件商店审核后台</h1>
      <label>
        <span>用户名</span>
        <input type="text" id="login-user" name="username" autocomplete="username" required>
      </label>
      <label>
        <span>密码</span>
        <input type="password" id="login-pass" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" id="login-btn">登录</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <!-- 审核视图 -->
  <div id="admin-view" class="view" hidden>
    <header class="topbar">
      <h1>插件商店审核后台</h1>
      <div class="topbar-right">
        <span id="current-user" class="muted"></span>
        <button id="logout-btn" class="btn btn-ghost">退出</button>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="pending">待审核 <span id="count-pending" class="badge">0</span></button>
      <button class="tab" data-tab="done">已审核 <span id="count-done" class="badge">0</span></button>
    </nav>

    <main id="list" class="list">
      <p class="muted loading">加载中…</p>
    </main>

    <!-- 拒绝原因弹窗 -->
    <dialog id="reject-dialog">
      <form method="dialog" id="reject-form" class="card">
        <h2>拒绝插件</h2>
        <p id="reject-target" class="muted"></p>
        <label>
          <span>拒绝原因（将写入 data/rejected/&lt;id&gt;.txt）</span>
          <textarea id="reject-reason" rows="4" placeholder="例如：包含未声明的可执行文件"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" id="reject-cancel" class="btn btn-ghost">取消</button>
          <button type="submit" id="reject-confirm" class="btn btn-danger">确认拒绝</button>
        </div>
      </form>
    </dialog>
  </div>

  <script src="/admin/review.js"></script>
</body>
</html>
